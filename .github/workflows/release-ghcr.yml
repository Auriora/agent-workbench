name: Release Agent Workbench Package

on:
  workflow_call:
    inputs:
      git_sha:
        description: "Validated immutable Git commit SHA for the release."
        required: true
        type: string
      version:
        description: "Validated release version without the v prefix."
        required: true
        type: string
      publish_latest:
        description: "Whether this version is the newest stable tag and may advance latest."
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release git SHA input
        env:
          RELEASE_GIT_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full 40-character release git SHA, got ${RELEASE_GIT_SHA}" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.git_sha }}

      - name: Verify checked-out release identity
        env:
          RELEASE_GIT_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "${checked_out_sha}" != "${RELEASE_GIT_SHA}" ]; then
            echo "Checked-out commit ${checked_out_sha} did not match expected ${RELEASE_GIT_SHA}" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Verify GHCR toolchain identities
        run: |
          set -euo pipefail
          git --version
          docker version
          docker buildx version

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/auriora/agent-workbench
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.git_sha }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packaging/agent-workbench/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
