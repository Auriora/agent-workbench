name: Release Agent Workbench Package

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to package, typically the validated release tag."
        required: true
        type: string
      version:
        description: "Validated release version without the v prefix."
        required: true
        type: string
      publish_latest:
        description: "Whether this version is the newest stable tag and may advance latest."
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/agent-workbench
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/agent-workbench/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
